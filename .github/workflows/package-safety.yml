name: Package safety

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-pub-contents:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Dart dependencies
        run: flutter pub get

      - name: Reject bundled vendor SDK files and inspect pub archive
        run: bash tool/check_publish_contents.sh
