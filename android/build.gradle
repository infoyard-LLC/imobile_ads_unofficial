group = "jp.infoyard.imobile_ads_unofficial"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

// The proprietary i-mobile SDK is intentionally not bundled with this plugin.
// Resolution order:
//   1. -PimobileSdkJar=/absolute/path/imobileSdkAds.jar
//   2. IMOBILE_ANDROID_SDK_JAR environment variable
//   3. Consumer Flutter app: android/app/libs/imobileSdkAds.jar
//   4. Plugin-development fallback: android/libs/imobileSdkAds.jar
//
// Option 4 is only for local plugin development and is excluded by both
// .gitignore and .pubignore.
def configuredImobileSdkJar = project.findProperty("imobileSdkJar") ?: System.getenv("IMOBILE_ANDROID_SDK_JAR")
def imobileSdkJarCandidates = []
if (configuredImobileSdkJar) {
    imobileSdkJarCandidates << file(configuredImobileSdkJar.toString())
}
imobileSdkJarCandidates << rootProject.file("app/libs/imobileSdkAds.jar")
imobileSdkJarCandidates << file("libs/imobileSdkAds.jar")

def imobileSdkJar = imobileSdkJarCandidates.find { candidate -> candidate.exists() }
if (imobileSdkJar == null) {
    throw new GradleException(
        "i-mobile Android SDK was not found. " +
        "Copy imobileSdkAds.jar to <your Flutter app>/android/app/libs/imobileSdkAds.jar, " +
        "or set -PimobileSdkJar=/absolute/path/imobileSdkAds.jar. " +
        "The SDK is not distributed with imobile_ads_unofficial."
    )
}

android {
    namespace = "jp.infoyard.imobile_ads_unofficial"
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen { false }
                showStandardStreams = true
            }
        }
    }
}

dependencies {
    implementation files(imobileSdkJar)
    implementation('com.google.android.gms:play-services-ads-identifier:18.2.0')
}
